[project]
name = "agent-memory-bench"
version = "0.1.0"
description = "Does graph memory cut an agent's token bill without hurting accuracy? A fair test against five baselines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "falkordb>=1.7.1",
    "fastembed>=0.8.1",
    "matplotlib>=3.11.2",
    "neo4j>=6.3.1",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
amb = "amb.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amb"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
